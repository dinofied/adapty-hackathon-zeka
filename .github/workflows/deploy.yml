name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        run: python -m py_compile server.py adapty_client.py scripts/smoke_test.py scripts/test_compatibility.py tests/test_referrals.py
      - name: Unit tests (rules engine, identity, webhook; mock Adapty)
        run: python -m unittest discover -s tests -v
      - name: HTTP and Windows compatibility regressions (mock Adapty)
        run: python scripts/test_compatibility.py
      - name: Browser API regressions
        run: node --test scripts/test_app_launch.js
      - name: Smoke test in mock mode
        env:
          PORT: "8080"
          DATA_DIR: ${{ runner.temp }}/data
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          python scripts/smoke_test.py http://localhost:8080 || (echo "--- server log"; cat server.log; exit 1)

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; skipping deploy (see docs/OPERATIONS.md)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered for ${GITHUB_SHA::7}; live in about a minute at https://lumen-referrals.onrender.com"
